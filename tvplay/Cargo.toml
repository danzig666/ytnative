[package]
name = "tvplay"
version = "0.1.0"
edition = "2021"
description = "webOS proof of concept: play a YouTube stream URL on the TV's hardware pipeline via an SDL exported window + com.webos.media"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
