# TV target: LG webOS userland is 32-bit ARM, soft-float ABI (/lib/ld-linux.so.3).
# Same codegen flags as plx-native: VFP instructions with the softfp calling convention, no NEON
# (keeps one binary loadable on every webOS 4+ SoC), frame pointers for on-device crash traces.
[target.armv7-unknown-linux-gnueabi]
linker = "tools/zig-cc-armv7.cmd"
rustflags = ["-C", "target-cpu=cortex-a9", "-C", "target-feature=-neon,-soft-float", "-C", "force-frame-pointers=yes",
    # GNU build id: the crash tracer logs it, `cargo xtask crash` matches it against ytnative.debug.
    "-C", "link-arg=-Wl,--build-id=sha1"]

[alias]
xtask = "run -q -p xtask --"

# C code for the TV (nanosvg) is compiled by zig through the same wrapper used for linking.
[env]
CC_armv7_unknown_linux_gnueabi = { value = "tools/zig-cc-armv7.cmd", relative = true }
AR_armv7_unknown_linux_gnueabi = { value = "tools/zig-ar.cmd", relative = true }
