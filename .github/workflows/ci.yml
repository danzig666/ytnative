# Tests + the TV cross-build on every push / pull request.
#
# The TV build links against stub libraries generated from ci/symbols/*.txt (tools/gen-stubs.py,
# run by crates/app/build.rs), so no LG binary is needed here. What the stubs cannot prove -- that
# every import exists on a real TV -- is `cargo xtask symcheck` / `fwcompat` on a dev machine with a
# pulled sysroot (docs/debugging.md).
name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: yt-core tests
        run: cargo test -p yt-core

  tv-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: zig (via the ziglang wheel, same version as on the dev PC)
        run: python -m pip install ziglang==0.13.0
      - name: Rust toolchain + TV target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add armv7-unknown-linux-gnueabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: armv7
      - name: Cross-build (stub-only link) + DT_NEEDED check
        # `cargo xtask build` also strips the binary and compares DT_NEEDED with
        # ci/expected-dt-needed.txt; a new dependency fails here.
        run: cargo xtask build
      - name: Crash symbolizer self-test
        run: cargo xtask crash --selftest
      - name: IPK
        run: cargo xtask ipk
      - uses: actions/upload-artifact@v4
        with:
          name: ytnative-ci-ipk
          path: target/ipk/*.ipk
          retention-days: 14
