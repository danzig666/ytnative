[workspace]
resolver = "2"
members = [
    "crates/yt-core", "crates/ytcli", "crates/ytnative-tv", "crates/app", "xtask",
    # plx-native UI core (GPL-3.0-or-later), vendored from github.com/GLinnik21/plx-native @ 31e6f24
    "vendor/plx/rust-modules/base", "vendor/plx/rust-modules/machine", "vendor/plx/rust-modules/gfx",
    "vendor/plx/rust-modules/platform", "vendor/plx/rust-modules/ui",
]
default-members = ["crates/yt-core", "crates/ytcli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/danzig666/ytnative"

[workspace.dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }

[workspace.lints.rust]
# The vendored plx crates opt into workspace lints; keep them as warnings here.
unexpected_cfgs = "allow"

[profile.release]
opt-level = "s"
lto = true
strip = true
