[package]
name = "ytnative-poc"
version = "0.1.0"
edition = "2021"
description = "Proof of concept: YouTube TV sign-in + playable stream extraction in Rust, for a future native webOS client"

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
